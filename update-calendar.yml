name: Aggiorna calendario Fantacalcio

on:
  workflow_dispatch:

  schedule:
    # Ogni giorno alle 04:00 UTC.
    # In Italia corrisponde normalmente alle 05:00 o alle 06:00,
    # a seconda dell'ora solare/legale.
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera calendario
        run: |
          python generate_calendar.py

      - name: Controlla modifiche
        id: changes
        run: |
          if git diff --quiet -- fantacalcio.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push del calendario
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fantacalcio.ics
          git commit -m "Aggiorna calendario Fantacalcio"
          git push

      - name: Nessuna modifica
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Il calendario non è cambiato."